name: publish-npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versions selected by this immutable tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stryke
          POSTGRES_PASSWORD: stryke
          POSTGRES_DB: stryke_reference_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stryke -d stryke_reference_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Require an immutable matching release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          sdk_version="$(node -p "require('./packages/sdk/package.json').version")"
          bot_version="$(node -p "require('./examples/reference-bot/package.json').version")"
          test "$sdk_version" = "$bot_version"
          test "$GITHUB_REF_NAME" = "npm-v${sdk_version}"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres-state
        env:
          TEST_POSTGRES_URL: postgres://stryke:stryke@127.0.0.1:5432/stryke_reference_bot_test
      - run: npm pack -w @stryke/sdk --dry-run
      - run: npm pack -w @stryke/reference-bot --dry-run
      - name: Install a current npm CLI for trusted publishing
        if: inputs.publish
        run: npm install --global npm@11.5.1
      - name: Refuse to overwrite an existing version
        if: inputs.publish
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          ! npm view "@stryke/sdk@$version" version
          ! npm view "@stryke/reference-bot@$version" version
      - name: Publish SDK with npm trusted publishing
        if: inputs.publish
        run: npm publish -w @stryke/sdk --access public
      - name: Publish reference bot with npm trusted publishing
        if: inputs.publish
        run: npm publish -w @stryke/reference-bot --access public
      - name: Verify clean installation from the public registry
        if: inputs.publish
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y
          npm install "@stryke/sdk@$version" "@stryke/reference-bot@$version"
          node --input-type=module -e "import('@stryke/sdk').then((sdk) => { if (!sdk.StrykeClient) process.exit(1) })"
          output="$(npx --no-install stryke-reference-bot)"
          test "$(printf '%s' "$output" | grep -c '"tick":')" = "2"
          printf '%s' "$output" | grep '"event":"stryke_compatibility"'
