name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stryke
          POSTGRES_PASSWORD: stryke
          POSTGRES_DB: stryke_reference_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stryke -d stryke_reference_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres-state
        env:
          TEST_POSTGRES_URL: postgres://stryke:stryke@127.0.0.1:5432/stryke_reference_bot_test
      - run: npm pack -w @stryketrade/sdk --dry-run
      - run: npm pack -w @stryketrade/reference-bot --dry-run
